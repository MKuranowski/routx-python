[properties]
cargo_build_command = 'cargo zigbuild'
cargo_build_target = 'x86_64-apple-darwin'
cargo_env = ['MACOSX_DEPLOYMENT_TARGET=11.0']

[binaries]
cpp = ['zig', 'c++', '--target=x86_64-macos.11.0']
strip = 'llvm-strip'

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
