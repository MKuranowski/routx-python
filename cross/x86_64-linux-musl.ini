[properties]
cargo_build_command = 'cargo zigbuild'
cargo_build_target = 'x86_64-unknown-linux-musl'
cargo_env = ['RUSTFLAGS=-C target-feature=-crt-static']

[binaries]
cpp = ['zig', 'c++', '--target=x86_64-linux-musl']
strip = 'llvm-strip'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
